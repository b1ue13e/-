allow = ["Bash=cd \"/f/-/02-Knowledge/🧠 学习系统\" && for d in 07-最优化方法 08-NLP全栈 13-强化学习 15-控制与机器人学 17-机器学习 35-数值分析 36-数据挖掘与信息检索; do echo \"=== $d ===\"; sed -n '/OPEN_TEXTBOOK_SPINE_START/,/OPEN_TEXTBOOK_SPINE_END/p' \"$d/📚 教材挂载索引.md\" 2>/dev/null | head -25; done", "Bash=cd \"/f/-/02-Knowledge/🧠 学习系统\" && for d in \"02-时间序列分析\" \"03-量化金融\"; do echo \"=== $d ===\"; ls \"$d\" | head -25; done", "Bash=cd \"/f/-/02-Knowledge/🧠 学习系统\" && grep -rl \"question>-\" --include=\"*.md\" 01-社交网络挖掘/ | while read f; do sed -i 's/> \\[!question>- 答案解析/> [!question]- 答案解析/' \"$f\"; done && grep -rn \"question>-\" --include=\"*.md\" 01-社交网络挖掘/ | wc -l", "Bash=cd \"F:\\-\" && python - <<'EOF'\nimport os, re, glob\n\nbase = r\"02-Knowledge/🧠 学习系统\"\nframe = os.path.join(base, \"🎭 深度学习框架\")\nfiles = glob.glob(os.path.join(frame, \"*.md\"))\n\n# 1. 模板结构合规检查\nrequired = [\n    \"## 0. 先判断它值不值得深挖\",\n    \"## 1. 这个知识点解决什么问题？\",\n    \"## 2. 为什么它重要？它有什么用？\",\n    \"## 3. 学它之前需要哪些前置知识？\",\n    \"## 4. 用直觉语言解释它\",\n    \"## 5. 正式定义、核心公式、符号解释\",\n    \"## 6. 推导思路和思想来源\",\n    \"## 7. 例子：基础 → 中等 → 实际应用\",\n    \"## 8. 常见误区和易混概念\",\n    \"## 9. 相关知识点与 Obsidian 双链建议\",\n    \"## 10. 闭卷复现任务\",\n    \"## 11. 自测题：5 道\",\n    \"## 12. 我的主动回忆区\",\n    \"## 13. 给 Obsidian 的归档建议\",\n]\nprint(\"=== 模板结构检查 ===\")\nok = True\nfor f in sorted(files):\n    txt = open(f, encoding=\"utf-8\").read()\n    missing = [r for r in required if r not in txt]\n    fm = txt.startswith(\"---\\ntitle:\")\n    status = \"OK\" if not missing and fm else \"FAIL\"\n    if status == \"FAIL\": ok = False\n    print(f\"{os.path.basename(f)}: {status}\" + (f\" 缺: {missing}\" if missing else \"\") + (\"\" if fm else \" [frontmatter缺失]\"))\n\n# 2. 链接完整性检查（框架内 7 个文件的全部 [[...]] 链接）\nprint(\"\\n=== 链接完整性检查 ===\")\nall_md = {os.path.relpath(p, base).replace(\"\\\\\", \"/\"): p for p in glob.glob(os.path.join(base, \"**\", \"*.md\"), recursive=True)}\ndef resolve(link):\n    # 去 |别名 和 #锚点\n    target = link.split(\"|\")[0].split(\"#\")[0].strip()\n    if \"/\" in target:\n        # 相对 base 的路径链接\n        return target + \".md\" in all_md\n    # 短链接：按 basename 匹配\n    for k in all_md:\n        if os.path.basename(k) == target + \".md\":\n            return True\n    return False\n\ncheck_files = files + [os.path.join(frame, \"🧭 开源作业体系-深度学习.md\")]\ntotal, broken = 0, []\nfor f in check_files:\n    txt = open(f, encoding=\"utf-8\").read()\n    for m in re.findall(r\"\\[\\[([^\\]]+)\\]\\]\", txt):\n        total += 1\n        if not resolve(m):\n            broken.append((os.path.basename(f), m))\nprint(f\"共检查 {total} 个链接，损坏 {len(broken)} 个\")\nfor f, m in broken:\n    print(f\"  [{f}] -> {m}\")\nif not broken:\n    print(\"全部链接可解析 ✔\")\nEOF", "Bash=cd \"F:\\-\" && PYTHONIOENCODING=utf-8 python - <<'EOF'\nimport os, re, glob, sys\n\nbase = r\"02-Knowledge/🧠 学习系统\"\nframe = os.path.join(base, \"🎭 深度学习框架\")\n\nall_md = {os.path.relpath(p, base).replace(\"\\\\\", \"/\"): p for p in glob.glob(os.path.join(frame, \"**\", \"*.md\"), recursive=True)}\nall_md.update({os.path.relpath(p, base).replace(\"\\\\\", \"/\"): p for p in glob.glob(os.path.join(base, \"**\", \"*.md\"), recursive=True)})\n\ndef resolve(link):\n    target = link.split(\"|\")[0].split(\"#\")[0].strip()\n    if \"/\" in target:\n        return target + \".md\" in all_md\n    for k in all_md:\n        if os.path.basename(k) == target + \".md\":\n            return True\n    return False\n\ncheck_files = glob.glob(os.path.join(frame, \"*.md\"))\ntotal, broken = 0, []\nfor f in check_files:\n    txt = open(f, encoding=\"utf-8\").read()\n    for m in re.findall(r\"\\[\\[([^\\]]+)\\]\\]\", txt):\n        total += 1\n        if not resolve(m):\n            broken.append((os.path.basename(f), m))\n\nprint(\"checked links:\", total, \"broken:\", len(broken))\nfor f, m in broken:\n    print(\"  BROKEN [{0}] -> {1}\".format(f, m))\nif not broken:\n    print(\"ALL LINKS RESOLVE OK\")\nEOF", "Bash=cd \"F:\\-\" && PYTHONIOENCODING=utf-8 python - <<'EOF'\nimport os, re, glob\n\nvault = r\"02-Knowledge\"\nbase = os.path.join(vault, \"🧠 学习系统\")\nframe = os.path.join(base, \"🎭 深度学习框架\")\n\n# 全 vault 文件索引（相对 vault 根）\nall_md = {}\nfor p in glob.glob(os.path.join(vault, \"**\", \"*.md\"), recursive=True):\n    all_md[os.path.relpath(p, vault).replace(\"\\\\\", \"/\")] = p\n\ndef resolve(link):\n    target = link.split(\"|\")[0].split(\"#\")[0].strip()\n    if target.startswith(\"02-Knowledge/\"):\n        return target + \".md\" in all_md\n    if \"/\" in target:\n        full = \"02-Knowledge/\" + target + \".md\"\n        return full in all_md\n    # 短链接：按 basename 精确匹配\n    for k in all_md:\n        if os.path.basename(k) == target + \".md\":\n            return True\n    return False\n\ncheck_files = glob.glob(os.path.join(frame, \"*.md\"))\ntotal, broken = 0, []\nfor f in check_files:\n    txt = open(f, encoding=\"utf-8\").read()\n    # 先统一表格转义 \\| -> | 再提取\n    txt_norm = txt.replace(\"\\\\|\", \"|\")\n    for m in re.findall(r\"\\[\\[([^\\]]+)\\]\\]\", txt_norm):\n        total += 1\n        if not resolve(m):\n            broken.append((os.path.basename(f), m))\n\nprint(\"checked:\", total, \"real broken:\", len(broken))\nfor f, m in broken:\n    print(\"  BROKEN [{0}] -> {1}\".format(f, m))\nEOF", "Bash=cd \"F:\\-\" && PYTHONIOENCODING=utf-8 python - <<'EOF'\nimport os, re, glob\n\nbase = os.path.join(\"02-Knowledge\", \"🧠 学习系统\")\nframe = os.path.join(base, \"🎭 深度学习框架\")\n\nall_md = {}\nfor p in glob.glob(os.path.join(base, \"**\", \"*.md\"), recursive=True):\n    all_md[os.path.relpath(p, base).replace(\"\\\\\", \"/\")] = p\n# 也索引 vault 根级（MOC 等）\nfor p in glob.glob(os.path.join(\"02-Knowledge\", \"MOC\", \"*.md\")):\n    all_md[\"02-Knowledge/MOC/\" + os.path.basename(p)] = p\n\ndef resolve(link):\n    target = link.split(\"|\")[0].split(\"#\")[0].strip()\n    if target.startswith(\"02-Knowledge/\"):\n        return target + \".md\" in all_md\n    if \"/\" in target:\n        return target + \".md\" in all_md\n    for k in all_md:\n        if os.path.basename(k) == target + \".md\":\n            return True\n    return False\n\ncheck_files = glob.glob(os.path.join(frame, \"*.md\"))\ntotal, broken = 0, []\nfor f in check_files:\n    txt = open(f, encoding=\"utf-8\").read().replace(\"\\\\|\", \"|\")\n    for m in re.findall(r\"\\[\\[([^\\]]+)\\]\\]\", txt):\n        total += 1\n        if not resolve(m):\n            broken.append((os.path.basename(f), m))\n\nprint(\"checked:\", total, \"real broken:\", len(broken))\nfor f, m in broken:\n    print(\"  [{0}] -> {1}\".format(f, m))\nEOF"]

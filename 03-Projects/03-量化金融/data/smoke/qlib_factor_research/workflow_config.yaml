qlib_init:
  provider_uri: replace-before-qrun
  region: cn
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs:
          start_time: '2018-01-01'
          end_time: '2022-12-31'
          fit_start_time: '2018-01-01'
          fit_end_time: '2020-12-31'
          instruments: csi300
      segments:
        train:
        - '2018-01-01'
        - '2020-12-31'
        valid:
        - '2021-01-01'
        - '2021-12-31'
        test:
        - '2022-01-01'
        - '2022-12-31'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config:
        strategy:
          class: TopkDropoutStrategy
          module_path: qlib.contrib.strategy.signal_strategy
          kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
        backtest:
          start_time: '2022-01-01'
          end_time: '2022-12-31'
          account: 100000000
          benchmark: SH000300
          exchange_kwargs:
            freq: day
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
